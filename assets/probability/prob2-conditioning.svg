<svg xmlns="http://www.w3.org/2000/svg" class="prob-diagram" width="360" height="382" viewBox="0 0 360 382" role="img" aria-labelledby="prob2-conditioning-title prob2-conditioning-desc" font-family="system-ui, -apple-system, sans-serif">
<title id="prob2-conditioning-title">Keep the evidence, then rescale</title>
<desc id="prob2-conditioning-desc">Of one hundred people, thirty drink tea and coffee, thirty drink tea only, and forty drink neither. Restricting to the sixty tea drinkers makes the thirty coffee drinkers one half of the remaining population.</desc>
<rect width="360" height="382" fill="#fff"/>
<text x="18" y="28" font-size="17" fill="#202b3c" font-weight="650">Keep the evidence, then rescale</text>
<text x="18" y="56" font-size="15" fill="#526174" >Before: all 100 people</text><rect x="18" y="73" width="162" height="78" rx="0" fill="#0e7490" stroke="none"/><rect x="180" y="73" width="162" height="78" rx="0" fill="#ecfeff" stroke="none"/><rect x="18" y="151" width="324" height="52" rx="0" fill="#e2e8f0" stroke="none"/><text x="99" y="105" font-size="15" fill="#fff" text-anchor="middle">Tea + coffee</text><text x="99" y="132" font-size="20" fill="#fff" text-anchor="middle" font-weight="650">30</text><text x="261" y="105" font-size="15" fill="#0e7490" text-anchor="middle">Tea only</text><text x="261" y="132" font-size="20" fill="#0e7490" text-anchor="middle" font-weight="650">30</text><text x="180" y="184" font-size="15" fill="#526174" text-anchor="middle">Neither: 40</text><line x1="180" y1="214" x2="180" y2="246" stroke="#0e7490" stroke-width="1.5" /><path d="M177.12344676837478,240.73450462865776 L180,246 L182.87655323162522,240.73450462865776" fill="none" stroke="#0e7490" stroke-width="2.5" stroke-linejoin="round" /><text x="18" y="238" font-size="14" fill="#0e7490" >Keep tea</text><rect x="18" y="261" width="162" height="58" rx="0" fill="#0e7490" stroke="none"/><rect x="180" y="261" width="162" height="58" rx="0" fill="#ecfeff" stroke="none"/><text x="99" y="286" font-size="16" fill="#fff" text-anchor="middle">30 / 60</text><text x="99" y="308" font-size="14" fill="#fff" text-anchor="middle">coffee</text><text x="261" y="286" font-size="16" fill="#0e7490" text-anchor="middle">30 / 60</text><text x="261" y="308" font-size="14" fill="#0e7490" text-anchor="middle">no coffee</text><text x="180" y="353" font-size="16" fill="#0e7490" text-anchor="middle" font-weight="650">P(coffee | tea) = 30/60 = 1/2</text>
</svg>
