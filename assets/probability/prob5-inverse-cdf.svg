<svg xmlns="http://www.w3.org/2000/svg" class="prob-diagram" width="360" height="381" viewBox="0 0 360 381" role="img" aria-labelledby="prob5-inverse-cdf-title prob5-inverse-cdf-desc" font-family="system-ui, -apple-system, sans-serif">
<title id="prob5-inverse-cdf-title">Turn a uniform height into a sample</title>
<desc id="prob5-inverse-cdf-desc">For the continuous CDF F(x) equals x squared on zero to one, choose a uniform height u equals 0.64. Move horizontally to the CDF and vertically to x equals square root of u equals 0.8. The resulting density is two x on zero to one.</desc>
<rect width="360" height="381" fill="#fff"/>
<text x="18" y="28" font-size="17" fill="#202b3c" font-weight="650">Turn a uniform height into a sample</text>
