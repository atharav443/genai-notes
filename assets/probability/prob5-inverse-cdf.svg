width="1.5" stroke-dasharray="5 4"/><circle cx="265" cy="158.2" r="5" fill="#a21caf" stroke="#a21caf" stroke-width="2"/><text x="57" y="163.2" font-size="14" fill="#a21caf" text-anchor="end">0.64</text><text x="53" y="99" font-size="14" fill="#526174" text-anchor="end">1</text><text x="65" y="291" font-size="14" fill="#526174" text-anchor="middle">0</text><text x="265" y="291" font-size="14" fill="#a21caf" text-anchor="middle">0.8</text><text x="315" y="291" font-size="14" fill="#526174" text-anchor="middle">1</text><text x="26" y="80" font-size="14" fill="#526174" >F(x)</text><text x="97" y="139" font-size="14" fill="#a21caf" >Across →</text><text x="274" y="229" font-size="14" fill="#a21caf" >↓ Down</text><rect x="12" y="309" width="336" height="66" rx="10" fill="#fdf4ff" stroke="none"/><text x="180" y="335" font-size="17" fill="#a21caf" text-anchor="middle" font-weight="650">u = 0.64 → x = √u = 0.8</text><text x="180" y="358" font-size="14" fill="#526174" text-anchor="middle">Draw u uniformly; return F⁻¹(u).</text>
</svg>
