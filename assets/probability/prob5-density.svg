<svg xmlns="http://www.w3.org/2000/svg" class="prob-diagram" width="360" height="344" viewBox="0 0 360 344" role="img" aria-labelledby="prob5-density-title prob5-density-desc" font-family="system-ui, -apple-system, sans-serif">
<title id="prob5-density-title">Probability is area, not height</title>
<desc id="prob5-density-desc">The uniform density on zero to one has height one. The shaded interval from one quarter to one half has width one quarter, hence probability one quarter. Any single point has zero width and therefore zero probability.</desc>
<rect width="360" height="344" fill="#fff"/>
<text x="18" y="28" font-size="17" fill="#202b3c" font-weight="650">Probability is area, not height</text>
<text x="18" y="56" font-size="14" fill="#526174" >Uniform(0, 1) · density f(x) = 1</text><rect x="65" y="95" width="252" height="130" rx="0" fill="#fdf4ff" stroke="none"/><rect x="128" y="95" width="63" height="130" rx="0" fill="#a21caf" stroke="none"/><line x1="42" y1="225" x2="337" y2="225" stroke="#526174" stroke-width="1.5" /><line x1="65" y1="243" x2="65" y2="78" stroke="#526174" stroke-width="1.5" /><path d="M42,225 H65 V95 H317 V225 H337" fill="none" stroke="#a21caf" stroke-width="2.5" stroke-linejoin="round" /><line x1="65" y1="225" x2="65" y2="232" stroke="#526174" stroke-width="1.5" /><text x="65" y="253" font-size="14" fill="#526174" text-anchor="middle">0</text><line x1="128" y1="225" x2="128" y2="232" stroke="#526174" stroke-width="1.5" /><text x="128" y="253" font-size="14" fill="#526174" text-anchor="middle">0.25</text><line x1="191" y1="225" x2="191" y2="232" stroke="#526174" stroke-width="1.5" /><text x="191" y="253" font-size="14" fill="#526174" text-anchor="middle">0.5</text><line x1="317" y1="225" x2="317" y2="232" stroke="#526174" stroke-width="1.5" /><text x="317" y="253" font-size="14" fill="#526174" text-anchor="middle">1</text><text x="47" y="101" font-size="14" fill="#526174" text-anchor="end">1</text><text x="25" y="79" font-size="14" fill="#526174" >f(x)</text><rect x="12" y="270" width="336" height="66" rx="10" fill="#fdf4ff" stroke="none"/><text x="180" y="296" font-size="17" fill="#a21caf" text-anchor="middle" font-weight="650">P(0.25 ≤ X ≤ 0.5) = 0.25</text><text x="180" y="319" font-size="14" fill="#526174" text-anchor="middle">Width 0.25 × height 1 = area 0.25</text>
</svg>
