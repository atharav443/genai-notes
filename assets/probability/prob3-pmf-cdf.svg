<svg xmlns="http://www.w3.org/2000/svg" class="prob-diagram" width="360" height="510" viewBox="0 0 360 510" role="img" aria-labelledby="prob3-pmf-cdf-title prob3-pmf-cdf-desc" font-family="system-ui, -apple-system, sans-serif">
<title id="prob3-pmf-cdf-title">One distribution, two views</title>
<desc id="prob3-pmf-cdf-desc">For a binomial count of heads in two fair coin flips, the probability masses at zero, one, and two are one quarter, one half, and one quarter. The right-continuous cumulative distribution jumps to one quarter at zero, three quarters at one, and one at two.</desc>
<rect width="360" height="510" fill="#fff"/>
<text x="18" y="28" font-size="17" fill="#202b3c" font-weight="650">One distribution, two views</text>
<text x="18" y="56" font-size="14" fill="#526174" >X = heads in two fair coin flips</text><text x="18" y="86" font-size="15" fill="#047857" font-weight="650">PMF · mass at each value</text><line x1="45" y1="223" x2="330" y2="223" stroke="#526174" stroke-width="1.5" /><line x1="45" y1="108" x2="45" y2="223" stroke="#526174" stroke-width="1.5" /><line x1="90" y1="223" x2="90" y2="173" stroke="#047857"  stroke-width="5"/><circle cx="90" cy="173" r="5" fill="#047857" stroke="#047857" stroke-width="2"/><text x="90" y="161" font-size="14" fill="#047857" text-anchor="middle">0.25</text><text x="90" y="245" font-size="14" fill="#526174" text-anchor="middle">0</text><line x1="190" y1="223" x2="190" y2="123" stroke="#047857"  stroke-width="5"/><circle cx="190" cy="123" r="5" fill="#047857" stroke="#047857" stroke-width="2"/><text x="190" y="111" font-size="14" fill="#047857" text-anchor="middle">0.5</text><text x="190" y="245" font-size="14" fill="#526174" text-anchor="middle">1</text><line x1="290" y1="223" x2="290" y2="173" stroke="#047857"  stroke-width="5"/><circle cx="290" cy="173" r="5" fill="#047857" stroke="#047857" stroke-width="2"/><text x="290" y="161" font-size="14" fill="#047857" text-anchor="middle">0.25</text><text x="290" y="245" font-size="14" fill="#526174" text-anchor="middle">2</text><text x="335" y="245" font-size="14" fill="#526174" >x</text><text x="18" y="281" font-size="15" fill="#047857" font-weight="650">CDF · accumulated mass</text><line x1="45" y1="439" x2="330" y2="439" stroke="#526174" stroke-width="1.5" /><line x1="45" y1="315" x2="45" y2="439" stroke="#526174" stroke-width="1.5" /><text x="35" y="329" font-size="13" fill="#526174" text-anchor="end">1</text><line x1="45" y1="439" x2="90" y2="439" stroke="#047857"  stroke-width="3"/><line x1="90" y1="410.25" x2="190" y2="410.25" stroke="#047857"  stroke-width="3"/><line x1="190" y1="352.75" x2="290" y2="352.75" stroke="#047857"  stroke-width="3"/><line x1="290" y1="324" x2="330" y2="324" stroke="#047857"  stroke-width="3"/><line x1="90" y1="439" x2="90" y2="410.25" stroke="#d8e0e8" stroke-width="1.5" stroke-dasharray="3 4"/><circle cx="90" cy="439" r="4" fill="#fff" stroke="#047857" stroke-width="2"/><circle cx="90" cy="410.25" r="4" fill="#047857" stroke="#047857" stroke-width="2"/><text x="90" y="462" font-size="14" fill="#526174" text-anchor="middle">0</text><line x1="190" y1="410.25" x2="190" y2="352.75" stroke="#d8e0e8" stroke-width="1.5" stroke-dasharray="3 4"/><circle cx="190" cy="410.25" r="4" fill="#fff" stroke="#047857" stroke-width="2"/><circle cx="190" cy="352.75" r="4" fill="#047857" stroke="#047857" stroke-width="2"/><text x="190" y="462" font-size="14" fill="#526174" text-anchor="middle">1</text><line x1="290" y1="352.75" x2="290" y2="324" stroke="#d8e0e8" stroke-width="1.5" stroke-dasharray="3 4"/><circle cx="290" cy="352.75" r="4" fill="#fff" stroke="#047857" stroke-width="2"/><circle cx="290" cy="324" r="4" fill="#047857" stroke="#047857" stroke-width="2"/><text x="290" y="462" font-size="14" fill="#526174" text-anchor="middle">2</text><text x="180" y="496" font-size="14" fill="#526174" text-anchor="middle">Each CDF jump equals the PMF mass.</text>
