<svg xmlns="http://www.w3.org/2000/svg" class="prob-diagram" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="prob3-temperature-title prob3-temperature-desc" font-family="system-ui, -apple-system, sans-serif">
<title id="prob3-temperature-title">Same logits, different temperature</title>
<desc id="prob3-temperature-desc">Logits two, one, and zero produce three categorical probabilities. Temperature one half gives approximately 0.867, 0.117, 0.016. Temperature one gives 0.665, 0.245, 0.090. Temperature two gives 0.506, 0.307, 0.186. Lower temperature concentrates mass on the largest logit.</desc>
<rect width="360" height="420" fill="#fff"/>
<text x="18" y="28" font-size="17" fill="#202b3c" font-weight="650">Same logits, different temperature</text>
<text x="18" y="56" font-size="15" fill="#526174" >Logits (2, 1, 0) → softmax(z / T)</text><text x="18" y="92" font-size="15" fill="#202b3c" font-weight="650">T = 0.5 · Sharper</text><rect x="18" y="105" width="280.84751963193645" height="25" rx="0" fill="#047857" stroke="none"/><rect x="298.84751963193645" y="105" width="38.00857861568827" height="25" rx="0" fill="#334155" stroke="none"/><rect x="336.85609824762474" y="105" width="5.143901752375232" height="25" rx="0" fill="#94a3b8" stroke="none"/><text x="18" y="153" font-size="15" fill="#526174" >0.867  /  0.117  /  0.016</text><text x="18" y="186" font-size="15" fill="#202b3c" font-weight="650">T = 1 · Original</text><rect x="18" y="199" width="215.5380696710423" height="25" rx="0" fill="#047857" stroke="none"/><rect x="233.5380696710423" y="199" width="79.29202462175444" height="25" rx="0" fill="#334155" stroke="none"/><rect x="312.83009429279673" y="199" width="29.16990570720327" height="25" rx="0" fill="#94a3b8" stroke="none"/><text x="18" y="247" font-size="15" fill="#526174" >0.665  /  0.245  /  0.090</text><text x="18" y="280" font-size="15" fill="#202b3c" font-weight="650">T = 2 · Flatter</text><rect x="18" y="293" width="164.0996467020319" height="25" rx="0" fill="#047857" stroke="none"/><rect x="182.0996467020319" y="293" width="99.53146697279347" height="25" rx="0" fill="#334155" stroke="none"/><rect x="281.6311136748254" y="293" width="60.36888632517461" height="25" rx="0" fill="#94a3b8" stroke="none"/><text x="18" y="341" font-size="15" fill="#526174" >0.506  /  0.307  /  0.186</text><rect x="12" y="341" width="336" height="66" rx="10" fill="#ecfdf5" stroke="none"/><text x="180" y="367" font-size="17" fill="#047857" text-anchor="middle" font-weight="650">Lower T → more concentrated</text><text x="180" y="390" font-size="14" fill="#526174" text-anchor="middle">For finite T &gt; 0, the ordering stays fixed.</text>
</svg>
