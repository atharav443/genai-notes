<svg xmlns="http://www.w3.org/2000/svg" class="prob-diagram" width="360" height="300" viewBox="0 0 360 300" role="img" aria-labelledby="prob1-pebbles-title prob1-pebbles-desc" font-family="system-ui, -apple-system, sans-serif">
<title id="prob1-pebbles-title">Probability is a share of the mass</title>
<desc id="prob1-pebbles-desc">Ten equally likely pebbles each weigh one tenth. Six form event A and four form its complement. Their probabilities are 0.6 and 0.4.</desc>
<rect width="360" height="300" fill="#fff"/>
<text x="18" y="28" font-size="17" fill="#202b3c" font-weight="650">Probability is a share of the mass</text>
<text x="18" y="54" font-size="14" fill="#526174" >10 outcomes · weight 1/10 each</text><circle cx="48" cy="91" r="17" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2"/><text x="48" y="96" font-size="14" fill="#fff" text-anchor="middle">A</text><circle cx="114" cy="91" r="17" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2"/><text x="114" y="96" font-size="14" fill="#fff" text-anchor="middle">A</text><circle cx="180" cy="91" r="17" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2"/><text x="180" y="96" font-size="14" fill="#fff" text-anchor="middle">A</text><circle cx="246" cy="91" r="17" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2"/><text x="246" y="96" font-size="14" fill="#fff" text-anchor="middle">A</text><circle cx="312" cy="91" r="17" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2"/><text x="312" y="96" font-size="14" fill="#fff" text-anchor="middle">A</text><circle cx="48" cy="144" r="17" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2"/><text x="48" y="149" font-size="14" fill="#fff" text-anchor="middle">A</text><circle cx="114" cy="144" r="17" fill="#fff" stroke="#526174" stroke-width="2"/><text x="114" y="149" font-size="14" fill="#526174" text-anchor="middle">Aᶜ</text><circle cx="180" cy="144" r="17" fill="#fff" stroke="#526174" stroke-width="2"/><text x="180" y="149" font-size="14" fill="#526174" text-anchor="middle">Aᶜ</text><circle cx="246" cy="144" r="17" fill="#fff" stroke="#526174" stroke-width="2"/><text x="246" y="149" font-size="14" fill="#526174" text-anchor="middle">Aᶜ</text><circle cx="312" cy="144" r="17" fill="#fff" stroke="#526174" stroke-width="2"/><text x="312" y="149" font-size="14" fill="#526174" text-anchor="middle">Aᶜ</text><rect x="18" y="183" width="194.4" height="25" rx="0" fill="#1d4ed8" stroke="none"/><rect x="212.4" y="183" width="129.6" height="25" rx="0" fill="#e2e8f0" stroke="none"/><text x="18" y="232" font-size="15" fill="#1d4ed8" font-weight="650">6 in A → P(A) = 0.6</text><text x="18" y="257" font-size="15" fill="#526174" >4 outside A → P(Aᶜ) = 0.4</text><text x="18" y="284" font-size="14" fill="#526174" >All ten weights add to 1.</text>
</svg>
