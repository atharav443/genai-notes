<svg xmlns="http://www.w3.org/2000/svg" class="prob-diagram" width="360" height="456" viewBox="0 0 360 456" role="img" aria-labelledby="prob2-bayes-title prob2-bayes-desc" font-family="system-ui, -apple-system, sans-serif">
<title id="prob2-bayes-title">A rare condition, seen in whole people</title>
<desc id="prob2-bayes-desc">Among one million people, one hundred have the condition and 999900 do not. A test with 99 percent sensitivity and one percent false positives gives 99 true positives and 9999 false positives. Of 10098 positive results, only 99 are true positives: about 0.98 percent.</desc>
<rect width="360" height="456" fill="#fff"/>
<text x="18" y="28" font-size="17" fill="#202b3c" font-weight="650">A rare condition, seen in whole people</text>
<rect x="18" y="52" width="324" height="43" rx="10" fill="#ecfeff" stroke="none"/><text x="180" y="80" font-size="17" fill="#0e7490" text-anchor="middle" font-weight="650">1,000,000 people tested</text><line x1="99" y1="95" x2="99" y2="121" stroke="#526174" stroke-width="1.5" /><path d="M96.12344676837478,115.73450462865776 L99,121 L101.87655323162522,115.73450462865776" fill="none" stroke="#526174" stroke-width="2.5" stroke-linejoin="round" /><line x1="261" y1="95" x2="261" y2="121" stroke="#526174" stroke-width="1.5" /><path d="M258.1234467683748,115.73450462865776 L261,121 L263.8765532316252,115.73450462865776" fill="none" stroke="#526174" stroke-width="2.5" stroke-linejoin="round" /><rect x="18" y="126" width="154" height="100" rx="10" fill="#f8fafc" stroke="#d8e0e8"/><rect x="188" y="126" width="154" height="100" rx="10" fill="#f8fafc" stroke="#d8e0e8"/><text x="95" y="152" font-size="15" fill="#202b3c" text-anchor="middle">Condition</text><text x="95" y="182" font-size="25" fill="#0e7490" text-anchor="middle" font-weight="650">100</text><text x="95" y="209" font-size="13" fill="#526174" text-anchor="middle">99% test positive</text><text x="265" y="152" font-size="15" fill="#202b3c" text-anchor="middle">No condition</text><text x="265" y="182" font-size="25" fill="#202b3c" text-anchor="middle" font-weight="650">999,900</text><text x="265" y="209" font-size="13" fill="#526174" text-anchor="middle">1% test positive</text><line x1="95" y1="228" x2="95" y2="256" stroke="#0e7490" stroke-width="1.5" /><path d="M92.12344676837478,250.73450462865776 L95,256 L97.87655323162522,250.73450462865776" fill="none" stroke="#0e7490" stroke-width="2.5" stroke-linejoin="round" /><line x1="265" y1="228" x2="265" y2="256" stroke="#0e7490" stroke-width="1.5" /><path d="M262.1234467683748,250.73450462865776 L265,256 L267.8765532316252,250.73450462865776" fill="none" stroke="#0e7490" stroke-width="2.5" stroke-linejoin="round" /><rect x="18" y="261" width="154" height="64" rx="10" fill="#ecfeff" stroke="none"/><rect x="188" y="261" width="154" height="64" rx="10" fill="#f1f5f9" stroke="none"/><text x="95" y="287" font-size="23" fill="#0e7490" text-anchor="middle" font-weight="650">99</text><text x="95" y="311" font-size="14" fill="#0e7490" text-anchor="middle">true positives</text><text x="265" y="287" font-size="23" fill="#202b3c" text-anchor="middle" font-weight="650">9,999</text><text x="265" y="311" font-size="14" fill="#526174" text-anchor="middle">false positives</text><line x1="95" y1="330" x2="157" y2="357" stroke="#0e7490" stroke-width="1.5" /><path d="M151.02389850020063,357.53498678871154 L157,357 L153.32092271960008,352.2603385812017" fill="none" stroke="#0e7490" stroke-width="2.5" stroke-linejoin="round" /><line x1="265" y1="330" x2="203" y2="357" stroke="#0e7490" stroke-width="1.5" /><path d="M206.67907728039992,352.2603385812017 L203,357 L208.97610149979937,357.53498678871154" fill="none" stroke="#0e7490" stroke-width="2.5" stroke-linejoin="round" /><rect x="12" y="369" width="336" height="66" rx="10" fill="#ecfeff" stroke="none"/><text x="180" y="395" font-size="17" fill="#0e7490" text-anchor="middle" font-weight="650">99 / 10,098 ≈ 0.98%</text><text x="180" y="418" font-size="14" fill="#526174" text-anchor="middle">Among positives, fewer than 1% have it.</text>
</svg>
