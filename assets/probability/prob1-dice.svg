y="230" font-size="15" fill="#202b3c" text-anchor="middle">5</text><rect x="118" y="207" width="39" height="35" rx="6" fill="#f1f5f9" stroke="none"/><text x="137.5" y="230" font-size="15" fill="#202b3c" text-anchor="middle">6</text><rect x="161" y="207" width="39" height="35" rx="6" fill="#1d4ed8" stroke="none"/><text x="180.5" y="230" font-size="15" fill="#fff" text-anchor="middle">7</text><rect x="204" y="207" width="39" height="35" rx="6" fill="#f1f5f9" stroke="none"/><text x="223.5" y="230" font-size="15" fill="#202b3c" text-anchor="middle">8</text><rect x="247" y="207" width="39" height="35" rx="6" fill="#f1f5f9" stroke="none"/><text x="266.5" y="230" font-size="15" fill="#202b3c" text-anchor="middle">9</text><rect x="290" y="207" width="39" height="35" rx="6" fill="#f1f5f9" stroke="none"/><text x="309.5" y="230" font-size="15" fill="#202b3c" text-anchor="middle">10</text><text x="49" y="269" font-size="14" fill="#526174" text-anchor="middle">5</text><rect x="75" y="246" width="39" height="35" rx="6" fill="#f1f5f9" stroke="none"/><text x="94.5" y="269" font-size="15" fill="#202b3c" text-anchor="middle">6</text><rect x="118" y="246" width="39" height="35" rx="6" fill="#1d4ed8" stroke="none"/><text x="137.5" y="269" font-size="15" fill="#fff" text-anchor="middle">7</text><rect x="161" y="246" width="39" height="35" rx="6" fill="#f1f5f9" stroke="none"/><text x="180.5" y="269" font-size="15" fill="#202b3c" text-anchor="middle">8</text><rect x="204" y="246" width="39" height="35" rx="6" fill="#f1f5f9" stroke="none"/><text x="223.5" y="269" font-size="15" fill="#202b3c" text-anchor="middle">9</text><rect x="247" y="246" width="39" height="35" rx="6" fill="#f1f5f9" stroke="none"/><text x="266.5" y="269" font-size="15" fill="#202b3c" text-anchor="middle">10</text><rect x="290" y="246" width="39" height="35" rx="6" fill="#f1f5f9" stroke="none"/><text x="309.5" y="269" font-size="15" fill="#202b3c" text-anchor="middle">11</text><text x="49" y="308" font-size="14" fill="#526174" text-anchor="middle">6</text><rect x="75" y="285" width="39" height="35" rx="6" fill="#1d4ed8" stroke="none"/><text x="94.5" y="308" font-size="15" fill="#fff" text-anchor="middle">7</text><rect x="118" y="285" width="39" height="35" rx="6" fill="#f1f5f9" stroke="none"/><text x="137.5" y="308" font-size="15" fill="#202b3c" text-anchor="middle">8</text><rect x="161" y="285" width="39" height="35" rx="6" fill="#f1f5f9" stroke="none"/><text x="180.5" y="308" font-size="15" fill="#202b3c" text-anchor="middle">9</text><rect x="204" y="285" width="39" height="35" rx="6" fill="#f1f5f9" stroke="none"/><text x="223.5" y="308" font-size="15" fill="#202b3c" text-anchor="middle">10</text><rect x="247" y="285" width="39" height="35" rx="6" fill="#f1f5f9" stroke="none"/><text x="266.5" y="308" font-size="15" fill="#202b3c" text-anchor="middle">11</text><rect x="290" y="285" width="39" height="35" rx="6" fill="#f1f5f9" stroke="none"/><text x="309.5" y="308" font-size="15" fill="#202b3c" text-anchor="middle">12</text><rect x="12" y="339" width="336" height="66" rx="10" fill="#eff6ff" stroke="none"/><text x="180" y="365" font-size="17" fill="#1d4ed8" text-anchor="middle" font-weight="650">P(sum = 7) = 6/36 = 1/6</text><text x="180" y="388" font-size="14" fill="#526174" text-anchor="middle">36 equally likely cells; 6 highlighted.</text><text x="180" y="426" font-size="14" fill="#526174" text-anchor="middle">The 11 sums are not equally likely.</text>
</svg>
