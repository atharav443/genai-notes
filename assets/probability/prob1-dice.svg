<svg xmlns="http://www.w3.org/2000/svg" class="prob-diagram" width="360" height="436" viewBox="0 0 360 436" role="img" aria-labelledby="prob1-dice-title prob1-dice-desc" font-family="system-ui, -apple-system, sans-serif">
<title id="prob1-dice-title">Why a sum of seven has six ways</title>
<desc id="prob1-dice-desc">A six by six grid gives all 36 ordered outcomes of two fair dice. The six cells whose sum is seven are highlighted. Seven therefore has probability six over 36, or one sixth.</desc>
<rect width="360" height="436" fill="#fff"/>
<text x="18" y="28" font-size="17" fill="#202b3c" font-weight="650">Why a sum of seven has six ways</text>
<text x="195" y="57" font-size="14" fill="#526174" text-anchor="middle">Second die</text><text x="18" y="82" font-size="14" fill="#526174" >First die</text><text x="95" y="82" font-size="14" fill="#526174" text-anchor="middle">1</text><text x="138" y="82" font-size="14" fill="#526174" text-anchor="middle">2</text><text x="181" y="82" font-size="14" fill="#526174" text-anchor="middle">3</text><text x="224" y="82" font-size="14" fill="#526174" text-anchor="middle">4</text><text x="267" y="82" font-size="14" fill="#526174" text-anchor="middle">5</text><text x="310" y="82" font-size="14" fill="#526174" text-anchor="middle">6</text><text x="49" y="113" font-size="14" fill="#526174" text-anchor="middle">1</text><rect x="75" y="90" width="39" height="35" rx="6" fill="#f1f5f9" stroke="none"/><text x="94.5" y="113" font-size="15" fill="#202b3c" text-anchor="middle">2</text><rect x="118" y="90" width="39" height="35" rx="6" fill="#f1f5f9" stroke="none"/><text x="137.5" y="113" font-size="15" fill="#202b3c" text-anchor="middle">3</text><rect x="161" y="90" width="39" height="35" rx="6" fill="#f1f5f9" stroke="none"/><text x="180.5" y="113" font-size="15" fill="#202b3c" text-anchor="middle">4</text><rect x="204" y="90" width="39" height="35" rx="6" fill="#f1f5f9" stroke="none"/><text x="223.5" y="113" font-size="15" fill="#202b3c" text-anchor="middle">5</text><rect x="247" y="90" width="39" height="35" rx="6" fill="#f1f5f9" stroke="none"/><text x="266.5" y="113" font-size="15" fill="#202b3c" text-anchor="middle">6</text><rect x="290" y="90" width="39" height="35" rx="6" fill="#1d4ed8" stroke="none"/><text x="309.5" y="113" font-size="15" fill="#fff" text-anchor="middle">7</text><text x="49" y="152" font-size="14" fill="#526174" text-anchor="middle">2</text><rect x="75" y="129" width="39" height="35" rx="6" fill="#f1f5f9" stroke="none"/><text x="94.5" y="152" font-size="15" fill="#202b3c" text-anchor="middle">3</text><rect x="118" y="129" width="39" height="35" rx="6" fill="#f1f5