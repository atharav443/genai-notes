<svg xmlns="http://www.w3.org/2000/svg" class="prob-diagram" width="360" height="462" viewBox="0 0 360 462" role="img" aria-labelledby="prob4-baseline-title prob4-baseline-desc" font-family="system-ui, -apple-system, sans-serif">
<title id="prob4-baseline-title">Same expected gradient, less noise</title>
<desc id="prob4-baseline-desc">For a fair Bernoulli variable and payoff ten X, the gradient estimator is payoff minus baseline times the score, which is plus one when X is one and minus one when X is zero. With baseline zero the estimates are zero and ten, each with probability one half, giving mean five and variance 25. With baseline five both estimates equal five, giving variance zero.</desc>
<rect width="360" height="462" fill="#fff"/>
<text x="18" y="28" font-size="17" fill="#202b3c" font-weight="650">Same expected gradient, less noise</text>
<text x="18" y="56" font-size="14" fill="#526174" >X ∼ Bernoulli(1/2), payoff = 10X</text><text x="18" y="81" font-size="14" fill="#526174" >Estimator: (payoff − b) × score</text><text x="18" y="112" font-size="16" fill="#4d7c0f" font-weight="650">No baseline · b = 0</text><rect x="161" y="129" width="38" height="88" rx="5" fill="#f7fee7" stroke="none"/><line x1="45" y1="195" x2="315" y2="195" stroke="#526174" stroke-width="1.5" /><line x1="45" y1="191" x2="45" y2="199" stroke="#526174" stroke-width="1.5" /><text x="45" y="220" font-size="14" fill="#526174" text-anchor="middle">0</text><line x1="180" y1="191" x2="180" y2="199" stroke="#526174" stroke-width="1.5" /><text x="180" y="220" font-size="14" fill="#526174" text-anchor="middle">5</text><line x1="315" y1="191" x2="315" y2="199" stroke="#526174" stroke-width="1.5" /><text x="315" y="220" font-size="14" fill="#526174" text-anchor="middle">10</text><circle cx="45" cy="148" r="7" fill="#4d7c0f" stroke="#4d7c0f" stroke-width="2"/><circle cx="315" cy="173" r="7" fill="#fff" stroke="#4d7c0f" stroke-width="2"/><text x="18" y="254" font-size="15" fill="#202b3c" >Mean = 5 · Variance = 25</text><text x="18" y="276" font-size="16" fill="#4d7c0f" font-weight="650">Baseline · b = 5</text><rect x="161" y="293" width="38" height="88" rx="5" fill="#f7fee7" stroke="none"/><line x1="45" y1="359" x2="315" y2="359" stroke="#526174" stroke-width="1.5" /><line x1="45" y1="355" x2="45" y2="363" stroke="#526174" stroke-width="1.5" /><text x="45" y="384" font-size="14" fill="#526174" text-anchor="middle">0</text><line x1="180" y1="355" x2="180" y2="363" stroke="#526174" stroke-width="1.5" /><text x="180" y="384" font-size="14" fill="#526174" text-anchor="middle">5</text><line x1="315" y1="355" x2="315" y2="363" stroke="#526174" stroke-width="1.5" /><text x="315" y="384" font-size="14" fill="#526174" text-anchor="middle">10</text><circle cx="180" cy="312" r="7" fill="#4d7c0f" stroke="#4d7c0f" stroke-width="2"/><circle cx="180" cy="337" r="7" fill="#fff" stroke="#4d7c0f" stroke-width="2"/><text x="18" y="418" font-size="15" fill="#202b3c" >Mean = 5 · Variance = 0</text><text x="180" y="452" font-size="13" fill="#526174" text-anchor="middle">● X = 0     ○ X = 1     each with P = 1/2</text>
</svg>
