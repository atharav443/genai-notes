<svg xmlns="http://www.w3.org/2000/svg" class="prob-diagram" width="360" height="476" viewBox="0 0 360 476" role="img" aria-labelledby="prob6-triangle-title prob6-triangle-desc" font-family="system-ui, -apple-system, sans-serif">
<title id="prob6-triangle-title">A joint density, its shadow, and a slice</title>
<desc id="prob6-triangle-desc">A uniform density of two fills the triangle zero less than y less than x less than one. Its x marginal is two x and its y marginal is two times one minus y. Conditioning on y equals one half leaves x uniform between one half and one, with density two and total area one.</desc>
<rect width="360" height="476" fill="#fff"/>
<text x="18" y="28" font-size="17" fill="#202b3c" font-weight="650">A joint density, its shadow, and a slice</text>
<text x="18" y="56" font-size="15" fill="#526174" >Uniform on 0 ≤ y ≤ x ≤ 1</text><path d="M70 263 L310 263 L310 83 Z" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><line x1="70" y1="263" x2="333" y2="263" stroke="#526174" stroke-width="1.5" /><line x1="70" y1="280" x2="70" y2="72" stroke="#526174" stroke-width="1.5" /><text x="58" y="86" font-size="14" fill="#526174" text-anchor="end">1</text><text x="310" y="288" font-size="14" fill="#526174" text-anchor="middle">1</text><text x="70" y="288" font-size="14" fill="#526174" text-anchor="middle">0</text><text x="337" y="269" font-size="15" fill="#526174" >x</text><text x="28" y="86" font-size="15" fill="#526174" >y</text><line x1="70" y1="173" x2="190" y2="173" stroke="#526174" stroke-width="1.5" stroke-dasharray="4 4"/><line x1="190" y1="173" x2="310" y2="173" stroke="#b45309"  stroke-width="5"/><text x="55" y="178" font-size="14" fill="#b45309" text-anchor="end">1/2</text><text x="219" y="232" font-size="16" fill="#b45309" text-anchor="middle">joint f = 2</text><text x="237" y="153" font-size="15" fill="#b45309" text-anchor="middle">y = 1/2</text><rect x="18" y="310" width="324" height="61" rx="10" fill="#f8fafc" stroke="#d8e0e8"/><text x="34" y="336" font-size="15" fill="#202b3c" font-weight="650">Marginals</text><text x="34" y="359" font-size="15" fill="#526174" >fX(x) = 2x    fY(y) = 2(1 − y)</text><rect x="12" y="388" width="336" height="66" rx="10" fill="#fffbeb" stroke="none"/><text x="180" y="414" font-size="17" fill="#b45309" text-anchor="middle" font-weight="650">Given Y = 1/2: fX|Y = 2</text><text x="180" y="437" font-size="14" fill="#526174" text-anchor="middle">Support (1/2, 1); area 2 × 1/2 = 1.</text>
</svg>
