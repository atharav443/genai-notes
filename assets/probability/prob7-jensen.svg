<svg xmlns="http://www.w3.org/2000/svg" class="prob-diagram" width="360" height="520" viewBox="0 0 360 520" role="img" aria-labelledby="prob7-jensen-title prob7-jensen-desc" font-family="system-ui, -apple-system, sans-serif">
<title id="prob7-jensen-title">Which way does Jensen point?</title>
<desc id="prob7-jensen-desc">Equal probability at zero and two gives mean one. For the convex function x squared, the average function value is two while the function of the average is one; the chord is above the curve. For the concave function four minus x squared, these become two and three; the chord is below the curve.</desc>
<rect width="360" height="520" fill="#fff"/>
<text x="18" y="28" font-size="17" fill="#202b3c" font-weight="650">Which way does Jensen point?</text>
<text x="18" y="56" font-size="14" fill="#526174" >P(X = 0) = P(X = 2) = 1/2</text><text x="18" y="83" font-size="16" fill="#57534e" font-weight="650">Convex · g(x) = x²</text><line x1="57" y1="214" x2="330" y2="214" stroke="#526174" stroke-width="1.5" /><path d="M70,214 L74.8,213.9584 L79.6,213.8336 L84.4,213.6256 L89.2,213.3344 L94,212.96 L98.8,212.5024 L103.6,211.9616 L108.4,211.3376 L113.19999999999999,210.6304 L118,209.84 L122.8,208.9664 L127.6,208.0096 L132.4,206.96959999999999 L137.2,205.8464 L142,204.64 L146.8,203.3504 L151.60000000000002,201.9776 L156.39999999999998,200.5216 L161.2,198.9824 L166,197.35999999999999 L170.8,195.6544 L175.6,193.8656 L180.4,191.99360000000001 L185.2,190.0384 L190,188 L194.8,185.8784 L199.60000000000002,183.6736 L204.4,181.3856 L209.2,179.0144 L214,176.56 L218.8,174.0224 L223.6,171.4016 L228.4,168.6976 L233.20000000000002,165.91039999999998 L238,163.04000000000002 L242.79999999999998,160.0864 L247.6,157.0496 L252.4,153.9296 L257.20000000000005,150.7264 L262,147.44 L266.79999999999995,144.0704 L271.6,140.6176 L276.4,137.0816 L281.2,133.4624 L286,129.76 L290.8,125.9744 L295.6,122.10560000000001 L300.4,118.1536 L305.2,114.11840000000001 L310,110 " fill="none" stroke="#57534e" stroke-width="2.5" stroke-linejoin="round" /><line x1="70" y1="214" x2="310" y2="110" stroke="#526174" stroke-width="1.5" stroke-dasharray="5 4"/><circle cx="190" cy="162" r="5" fill="#fff" stroke="#526174" stroke-width="2"/><circle cx="190" cy="188" r="5" fill="#57534e" stroke="#57534e" stroke-width="2"/><line x1="190" y1="188" x2="190" y2="162" stroke="#526174" stroke-width="1.5" /><text x="70" y="236" font-size="14" fill="#526174" text-anchor="middle">0</text><text x="190" y="236" font-size="14" fill="#526174" text-anchor="middle">1</text><text x="310" y="236" font-size="14" fill="#526174" text-anchor="middle">2</text><text x="180" y="264" font-size="15" fill="#57534e" text-anchor="middle" font-weight="650">E[g(X)] = 2 ≥ 1 = g(E[X])</text><text x="18" y="301" font-size="16" fill="#57534e" font-weight="650">Concave · g(x) = 4 − x²</text><line x1="57" y1="432" x2="330" y2="432" stroke="#526174" stroke-width="1.5" /><path d="M70,328 L74.8,328.0416 L79.6,328.1664 L84.4,328.37440000000004 L89.2,328.6656 L94,329.04 L98.8,329.4976 L103.6,330.0384 L108.4,330.6624 L113.19999999999999,331.3696 L118,332.15999999999997 L122.8,333.0336 L127.6,333.9904 L132.4,335.0304 L137.2,336.1536 L142,337.36 L146.8,338.6496 L151.60000000000002,340.0224 L156.39999999999998,341.47839999999997 L161.2,343.0176 L166,344.64 L170.8,346.3456 L175.6,348.1344 L180.4,350.0064 L185.2,351.9616 L190,354 L194.8,356.1216 L199.60000000000002,358.32640000000004 L204.4,360.61440000000005 L209.2,362.9856 L214,365.44 L218.8,367.9776 L223.6,370.59839999999997 L228.4,373.3024 L233.20000000000002,376.0896 L238,378.96 L242.79999999999998,381.9136 L247.6,384.9504 L252.4,388.0704 L257.20000000000005,391.2736 L262,394.56 L266.79999999999995,397.9296 L271.6,401.38239999999996 L276.4,404.9184 L281.2,408.5376 L286,412.24 L290.8,416.0256 L295.6,419.8944 L300.4,423.8464 L305.2,427.8816 L310,432 " fill="none" stroke="#57534e" stroke-width="2.5" stroke-linejoin="round" /><line x1="70" y1="328" x2="310" y2="432" stroke="#526174" stroke-width="1.5" stroke-dasharray="5 4"/><circle cx="190" cy="380" r="5" fill="#fff" stroke="#526174" stroke-width="2"/><circle cx="190" cy="354" r="5" fill="#57534e" stroke="#57534e" stroke-width="2"/><line x1="190" y1="354" x2="190" y2="380" stroke="#526174" stroke-width="1.5" /><text x="70" y="454" font-size="14" fill="#526174" text-anchor="middle">0</text><text x="190" y="454" font-size="14" fill="#526174" text-anchor="middle">1</text><text x="310" y="454" font-size="14" fill="#526174" text-anchor="middle">2</text><text x="180" y="482" font-size="15" fill="#57534e" text-anchor="middle" font-weight="650">E[g(X)] = 2 ≤ 3 = g(E[X])</text>
</svg>
