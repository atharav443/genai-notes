<svg xmlns="http://www.w3.org/2000/svg" class="prob-diagram" width="360" height="490" viewBox="0 0 360 490" role="img" aria-labelledby="prob5-reparameterization-title prob5-reparameterization-desc" font-family="system-ui, -apple-system, sans-serif">
<title id="prob5-reparameterization-title">Two routes to the same gradient</title>
<desc id="prob5-reparameterization-desc">The score-function route samples z from a parameter-dependent Gaussian and differentiates the log density, weighting by the function value. The pathwise route samples independent standard Gaussian epsilon, computes z equals mu plus sigma epsilon, and differentiates through that deterministic map. Both require their usual regularity conditions.</desc>
<rect width="360" height="490" fill="#fff"/>
<text x="18" y="28" font-size="17" fill="#202b3c" font-weight="650">Two routes to the same gradient</text>
<text x="18" y="56" font-size="15" fill="#526174" >Both target ∇ E[f(z)]</text><rect x="18" y="75" width="324" height="165" rx="10" fill="#f8fafc" stroke="#d8e0e8"/><text x="34" y="102" font-size="16" fill="#202b3c" font-weight="650">01  Score-function route</text><text x="34" y="134" font-size="16" fill="#202b3c" >Sample z ∼ N(μ, σ²)</text><line x1="180" y1="146" x2="180" y2="165" stroke="#a21caf" stroke-width="1.5" /><path d="M177.12344676837478,159.73450462865776 L180,165 L182.87655323162522,159.73450462865776" fill="none" stroke="#a21caf" stroke-width="2.5" stroke-linejoin="round" /><text x="180" y="191" font-size="18" fill="#a21caf" text-anchor="middle" font-weight="650">f(z) × ∇ log p(z)</text><text x="34" y="220" font-size="14" fill="#526174" >Differentiate the log density.</text><rect x="18" y="258" width="324" height="202" rx="10" fill="#fdf4ff" stroke="none"/><text x="34" y="286" font-size="16" fill="#a21caf" font-weight="650">02  Pathwise route</text><text x="34" y="316" font-size="16" fill="#202b3c" >Sample ε ∼ N(0, 1)</text><line x1="180" y1="325" x2="180" y2="345" stroke="#a21caf" stroke-width="1.5" /><path d="M177.12344676837478,339.73450462865776 L180,345 L182.87655323162522,339.73450462865776" fill="none" stroke="#a21caf" stroke-width="2.5" stroke-linejoin="round" /><text x="180" y="371" font-size="21" fill="#a21caf" text-anchor="middle" font-weight="650">z = μ + σε</text><text x="34" y="405" font-size="16" fill="#202b3c" >∂z/∂μ = 1     ∂z/∂σ = ε</text><text x="34" y="435" font-size="14" fill="#526174" >Differentiate f through z.</text><text x="180" y="483" font-size="13" fill="#526174" text-anchor="middle">For smooth VAE losses, pathwise is often quieter.</text>
</svg>
