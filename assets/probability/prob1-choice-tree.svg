<svg xmlns="http://www.w3.org/2000/svg" class="prob-diagram" width="360" height="448" viewBox="0 0 360 448" role="img" aria-labelledby="prob1-choice-tree-title prob1-choice-tree-desc" font-family="system-ui, -apple-system, sans-serif">
<title id="prob1-choice-tree-title">One path, one complete choice</title>
<desc id="prob1-choice-tree-desc">Four shirts each connect to three trouser choices, giving twelve outfits. A separate six-position licence plate has three letter choices of 26 possibilities followed by three digit choices of ten possibilities.</desc>
