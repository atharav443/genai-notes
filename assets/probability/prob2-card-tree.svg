<svg xmlns="http://www.w3.org/2000/svg" class="prob-diagram" width="360" height="458" viewBox="0 0 360 458" role="img" aria-labelledby="prob2-card-tree-title prob2-card-tree-desc" font-family="system-ui, -apple-system, sans-serif">
<title id="prob2-card-tree-title">Multiply along a path; add across paths</title>
<desc id="prob2-card-tree-desc">First ace with probability four over 52 branches to a second ace with probability three over 51 or a non-ace with probability 48 over 51. First non-ace with probability 48 over 52 branches to ace four over 51 or non-ace 47 over 51. All four joint probabilities sum to one.</desc>
<rect width="360" height="458" fill="#fff"/>
<text x="18" y="28" font-size="17" fill="#202b3c" font-weight="650">Multiply along a path; add across paths</text>
<text x="18" y="56" font-size="14" fill="#526174" >Two draws without replacement</text><rect x="18" y="76" width="324" height="36" rx="7" fill="#ecfeff" stroke="none"/><text x="180" y="100" font-size="16" fill="#0e7490" text-anchor="middle">First card: ace · 4/52</text><line x1="99" y1="112" x2="99" y2="143" stroke="#0e7490" stroke-width="1.5" /><path d="M96.12344676837478,137.73450462865776 L99,143 L101.87655323162522,137.73450462865776" fill="none" stroke="#0e7490" stroke-width="2.5" stroke-linejoin="round" /><line x1="261" y1="112" x2="261" y2="143" stroke="#0e7490" stroke-width="1.5" /><path d="M258.1234467683748,137.73450462865776 L261,143 L263.8765532316252,137.73450462865776" fill="none" stroke="#0e7490" stroke-width="2.5" stroke-linejoin="round" /><rect x="18" y="148" width="154" height="79" rx="10" fill="#f8fafc" stroke="#d8e0e8"/><rect x="188" y="148" width="154" height="79" rx="10" fill="#f8fafc" stroke="#d8e0e8"/><text x="95" y="172" font-size="15" fill="#202b3c" text-anchor="middle">Ace · 3/51</text><text x="95" y="201" font-size="16" fill="#0e7490" text-anchor="middle" font-weight="650">12/2652</text><text x="265" y="172" font-size="14" fill="#202b3c" text-anchor="middle">Not ace · 48/51</text><text x="265" y="201" font-size="16" fill="#0e7490" text-anchor="middle" font-weight="650">192/2652</text><rect x="18" y="248" width="324" height="36" rx="7" fill="#ecfeff" stroke="none"/><text x="180" y="272" font-size="16" fill="#0e7490" text-anchor="middle">First card: not ace · 48/52</text><line x1="99" y1="284" x2="99" y2="310" stroke="#0e7490" stroke-width="1.5" /><path d="M96.12344676837478,304.73450462865776 L99,310 L101.87655323162522,304.73450462865776" fill="none" stroke="#0e7490" stroke-width="2.5" stroke-linejoin="round" /><line x1="261" y1="284" x2="261" y2="310" stroke="#0e7490" stroke-width="1.5" /><path d="M258.1234467683748,304.73450462865776 L261,310 L263.8765532316252,304.73450462865776" fill="none" stroke="#0e7490" stroke-width="2.5" stroke-linejoin="round" /><rect x="18" y="315" width="154" height="79" rx="10" fill="#f8fafc" stroke="#d8e0e8"/><rect x="188" y="315" width="154" height="79" rx="10" fill="#f8fafc" stroke="#d8e0e8"/><text x="95" y="339" font-size="15" fill="#202b3c" text-anchor="middle">Ace · 4/51</text><text x="95" y="368" font-size="16" fill="#0e7490" text-anchor="middle" font-weight="650">192/2652</text><text x="265" y="339" font-size="14" fill="#202b3c" text-anchor="middle">Not ace · 47/51</text><text x="265" y="368" font-size="16" fill="#0e7490" text-anchor="middle" font-weight="650">2256/2652</text><text x="180" y="432" font-size="14" fill="#526174" text-anchor="middle">(12 + 192 + 192 + 2256)/2652 = 1</text>
</svg>
