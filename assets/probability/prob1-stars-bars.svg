<svg xmlns="http://www.w3.org/2000/svg" class="prob-diagram" width="360" height="344" viewBox="0 0 360 344" role="img" aria-labelledby="prob1-stars-bars-title prob1-stars-bars-desc" font-family="system-ui, -apple-system, sans-serif">
<title id="prob1-stars-bars-title">Stars choose scoops; bars divide flavours</title>
<desc id="prob1-stars-bars-desc">Three stars and three separator bars form six positions for four flavours. The example star bar star star bar bar gives one scoop of the first flavour, two of the second, and none of the last two. Choosing three star positions among six gives twenty arrangements.</desc>
<rect width="360" height="344" fill="#fff"/>
<text x="18" y="28" font-size="17" fill="#202b3c" font-weight="650">Stars choose scoops; bars divide flavours</text>
<text x="18" y="57" font-size="14" fill="#526174" >3 identical scoops · 4 distinct flavours</text><rect x="18" y="79" width="48" height="54" rx="7" fill="#eff6ff" stroke="none"/><text x="42" y="115" font-size="28" fill="#1d4ed8" text-anchor="middle">★</text><rect x="73" y="79" width="48" height="54" rx="7" fill="#f1f5f9" stroke="none"/><text x="97" y="115" font-size="28" fill="#526174" text-anchor="middle">|</text><rect x="128" y="79" width="48" height="54" rx="7" fill="#eff6ff" stroke="none"/><text x="152" y="115" font-size="28" fill="#1d4ed8" text-anchor="middle">★</text><rect x="183" y="79" width="48" height="54" rx="7" fill="#eff6ff" stroke="none"/><text x="207" y="115" font-size="28" fill="#1d4ed8" text-anchor="middle">★</text><rect x="238" y="79" width="48" height="54" rx="7" fill="#f1f5f9" stroke="none"/><text x="262" y="115" font-size="28" fill="#526174" text-anchor="middle">|</text><rect x="293" y="79" width="48" height="54" rx="7" fill="#f1f5f9" stroke="none"/><text x="317" y="115" font-size="28" fill="#526174" text-anchor="middle">|</text><text x="180" y="163" font-size="15" fill="#202b3c" text-anchor="middle">3 stars + 3 bars = 6 positions</text><rect x="18" y="184" width="75" height="55" rx="7" fill="#f8fafc" stroke="#d8e0e8"/><text x="55.5" y="204" font-size="12" fill="#526174" text-anchor="middle">Flavour 1</text><text x="55.5" y="226" font-size="14" fill="#202b3c" text-anchor="middle">1 scoop</text><rect x="101" y="184" width="75" height="55" rx="7" fill="#f8fafc" stroke="#d8e0e8"/><text x="138.5" y="204" font-size="12" fill="#526174" text-anchor="middle">Flavour 2</text><text x="138.5" y="226" font-size="14" fill="#202b3c" text-anchor="middle">2 scoops</text><rect x="184" y="184" width="75" height="55" rx="7" fill="#f8fafc" stroke="#d8e0e8"/><text x="221.5" y="204" font-size="12" fill="#526174" text-anchor="middle">Flavour 3</text><text x="221.5" y="226" font-size="14" fill="#202b3c" text-anchor="middle">0 scoops</text><rect x="267" y="184" width="75" height="55" rx="7" fill="#f8fafc" stroke="#d8e0e8"/><text x="304.5" y="204" font-size="12" fill="#526174" text-anchor="middle">Flavour 4</text><text x="304.5" y="226" font-size="14" fill="#202b3c" text-anchor="middle">0 scoops</text><rect x="12" y="260" width="336" height="66" rx="10" fill="#eff6ff" stroke="none"/><text x="180" y="286" font-size="17" fill="#1d4ed8" text-anchor="middle" font-weight="650">Choose 3 of 6 positions: 20</text><text x="180" y="309" font-size="14" fill="#526174" text-anchor="middle">C(3 + 4 − 1, 3) = C(6, 3)</text>
</svg>
