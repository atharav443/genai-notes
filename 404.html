<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page not found — Generative AI Cheat Sheets</title>
<!-- Self-contained on purpose: a 404 is served from an arbitrary depth, so a
     relative stylesheet href would resolve against the wrong base. -->
<style>
body{margin:0;background:#fbfaf8;color:#1a1a1d;
     font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
.w{max-width:900px;margin:0 auto;padding:56px 22px}
h1{font-size:32px;letter-spacing:-.02em;margin:0 0 6px}
p{color:#5c5c66;margin:0 0 22px}
a{color:#1a1a1d;font-weight:700}
code{font-family:ui-monospace,Menlo,monospace;font-size:14px;background:#fff;
     border:1px solid #e3e0da;border-radius:6px;padding:2px 6px}
</style></head><body><div class="w">
<h1>404 — no such page</h1>
<p>That URL isn't part of this site. Every article sits one level under the
<code>&larr; All topics</code> bar.</p>
<p><a id="home" href="./index.html">← Back to all topics</a></p>
</div>
<script>
// GitHub project pages serve from /REPO/, so recover the site root from the first
// path segment. Falls back to the relative href above when that isn't a repo path.
(function () {
  var seg = location.pathname.split('/').filter(Boolean);
  if (seg.length) document.getElementById('home').href = '/' + seg[0] + '/';
})();
</script>
</body></html>
